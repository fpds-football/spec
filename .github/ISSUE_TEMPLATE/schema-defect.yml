name: Schema defect
description: The schema accepts a document that SPEC.md rejects, or rejects a document that SPEC.md accepts.
labels: ["defect", "schema"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when the schema and `SPEC.md` disagree. If you think that the
        specification itself is wrong, open a Discussion.

  - type: input
    id: version
    attributes:
      label: Schema version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: Section of SPEC.md
      placeholder: "Section 9, performance"
    validations:
      required: true

  - type: textarea
    id: document
    attributes:
      label: Smallest document
      description: The smallest submission that shows the problem. GitHub shows it as JSON.
      render: json
    validations:
      required: true

  - type: dropdown
    id: direction
    attributes:
      label: What happens
      options:
        - The schema accepts this document, and SPEC.md rejects it
        - The schema rejects this document, and SPEC.md accepts it
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: The correct result, and the text in SPEC.md that gives it
    validations:
      required: true
