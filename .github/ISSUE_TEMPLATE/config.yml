blank_issues_enabled: false
contact_links:
  - name: Answer a consultation
    url: https://fpds.football/consult/
    about: For agents, clubs, players and recruitment staff. You do not need a GitHub account.
  - name: Propose a field, or argue against a field
    url: https://github.com/fpds-football/spec/discussions/categories/field-proposals
    about: Proposals and objections about fields go in a Discussion, not in an issue.
  - name: Ask how something works
    url: https://github.com/fpds-football/spec/discussions/categories/q-a
    about: Questions about FPDS, or about a case that the specification does not clearly cover.
  - name: Report a security or privacy defect
    url: https://github.com/fpds-football/spec/security/advisories/new
    about: Report a schema defect with security or data-protection impact in private.
