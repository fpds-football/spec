name: Spec ambiguity
description: A part of SPEC.md has two meanings, and two implementations can disagree about it.
labels: ["spec", "ambiguity"]
body:
  - type: input
    id: section
    attributes:
      label: Section
      placeholder: "Section 11, provenance"
    validations:
      required: true

  - type: textarea
    id: text
    attributes:
      label: The text
      description: Copy the sentence or the table row.
    validations:
      required: true

  - type: textarea
    id: readings
    attributes:
      label: The two meanings
      description: For each meaning, what a producer does, and what a consumer then must process.
      placeholder: |
        Meaning A: ...
        Meaning B: ...
    validations:
      required: true

  - type: textarea
    id: preference
    attributes:
      label: The meaning that you prefer, and its cost
    validations:
      required: false
