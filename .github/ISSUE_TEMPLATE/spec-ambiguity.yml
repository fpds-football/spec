name: Spec ambiguity
description: A part of SPEC.md can be read two ways, and two implementations could reasonably disagree.
labels: ["spec", "ambiguity"]
body:
  - type: input
    id: section
    attributes:
      label: Section
      placeholder: "Section 11, provenance"
    validations:
      required: true

  - type: textarea
    id: text
    attributes:
      label: The text in question
      description: Quote the sentence or table row.
    validations:
      required: true

  - type: textarea
    id: readings
    attributes:
      label: The two readings
      description: What a producer might do under each, and what a consumer would then have to handle.
      placeholder: |
        Reading A: ...
        Reading B: ...
    validations:
      required: true

  - type: textarea
    id: preference
    attributes:
      label: Which reading you would prefer, and what it costs
    validations:
      required: false
